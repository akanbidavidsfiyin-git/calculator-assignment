<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator | Assignment</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="fav.png" type="image/x-icon">
</head>

<body>
    <div class="page-background">
        <div class="calc-box">
            <h1>CALLI</h1>
            <div id="screen">0</div>
            <div id="input-fields">
                <input type="text" id="input1">
                <input type="text" id="input2">
            </div>

            <div id="operators">
                <button id="btn-add" onclick="add()">+</button>
                <button id="btn-sub" onclick="subtract()">-</button>
                <button id="btn-mult" onclick="multiply()">×</button>
                <button id="btn-div" onclick="divide()">÷</button>
                <button id="btn-div" onclick="mod()">MOD</button>
            </div>
        </div>
    </div>
</body>
<script src="script.js"></script>

</html>
